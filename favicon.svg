<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.35"/>
  
  <!-- Bill / Invoice Document Shape with Folded Corner -->
  <g filter="url(#shadow)">
    <path d="M124 84 H324 L388 148 V420 C388 428.8 380.8 436 372 436 H140 C131.2 436 124 428.8 124 420 Z" fill="url(#paperGrad)"/>
    <path d="M324 84 V140 C324 144.4 327.6 148 332 148 H388 Z" fill="#a7f3d0"/>
  </g>
  
  <!-- Indian Rupee symbol ₹ in emerald -->
  <text x="256" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="130" font-weight="900" fill="#047857" text-anchor="middle">₹</text>

  <!-- Bill lines below Rupee -->
  <rect x="160" y="295" width="170" height="14" rx="7" fill="#10b981"/>
  <rect x="160" y="325" width="115" height="12" rx="6" fill="#6ee7b7"/>
  <rect x="160" y="352" width="135" height="12" rx="6" fill="#6ee7b7"/>

  <!-- QR Code mini badge on bottom right -->
  <rect x="290" y="315" width="85" height="85" rx="16" fill="#0f172a"/>
  
  <!-- QR mini pattern -->
  <rect x="302" y="327" width="26" height="26" rx="5" fill="#ffffff"/>
  <rect x="308" y="333" width="14" height="14" rx="2" fill="#0f172a"/>
  
  <rect x="337" y="327" width="26" height="26" rx="5" fill="#ffffff"/>
  <rect x="343" y="333" width="14" height="14" rx="2" fill="#0f172a"/>

  <rect x="302" y="362" width="26" height="26" rx="5" fill="#ffffff"/>
  <rect x="308" y="368" width="14" height="14" rx="2" fill="#0f172a"/>

  <rect x="337" y="362" width="12" height="12" rx="3" fill="#34d399"/>
  <rect x="351" y="376" width="12" height="12" rx="3" fill="#34d399"/>
</svg>
